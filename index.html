<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>y3162 Research & Projects</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #1c3177 0%, #7f96c2 100%);
            min-height: 100vh;
            color: #333;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            top: -100px;
            right: -100px;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            bottom: -50px;
            left: -50px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 80px;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 16px;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 32px;
            margin-top: 60px;
        }

        .project-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: fadeInUp 0.8s ease-out;
            cursor: pointer;
            border: 1px solid rgba(127, 150, 194, 0.2);
            backdrop-filter: blur(10px);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        .project-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 20px 60px rgba(28, 49, 119, 0.2);
            border-color: rgba(127, 150, 194, 0.4);
            background: rgba(255, 255, 255, 0.98);
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #1c3177, #7f96c2);
            border-radius: 16px 16px 0 0;
        }

        .project-card {
            position: relative;
        }

        .project-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #1c3177, #7f96c2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 16px;
            color: #fff;
        }

        .project-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1c3177;
            margin-bottom: 12px;
            transition: color 0.3s ease;
        }

        .project-card:hover .project-title {
            color: #7f96c2;
        }

        .project-description {
            font-size: 0.95rem;
            color: #666;
            line-height: 1.6;
            margin-bottom: 16px;
            flex-grow: 1;
        }

        .modality-tags {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .modality-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            background: rgba(28, 49, 119, 0.08);
            color: #1c3177;
            border: 1px solid rgba(28, 49, 119, 0.15);
            transition: all 0.3s ease;
        }

        .project-card:hover .modality-badge {
            background: rgba(127, 150, 194, 0.15);
            border-color: rgba(127, 150, 194, 0.3);
        }

        .modality-badge.audio {
            background: linear-gradient(135deg, rgba(127, 150, 194, 0.12), rgba(28, 49, 119, 0.08));
            border-color: rgba(127, 150, 194, 0.3);
            color: #1c3177;
        }

        .modality-badge.image {
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.12), rgba(255, 140, 0, 0.08));
            border-color: rgba(255, 140, 0, 0.3);
            color: #c93a70;
        }

        .modality-badge.video {
            background: linear-gradient(135deg, rgba(106, 17, 203, 0.12), rgba(63, 81, 181, 0.08));
            border-color: rgba(63, 81, 181, 0.3);
            color: #3f51b5;
        }

        .modality-badge.text {
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.12), rgba(56, 142, 60, 0.08));
            border-color: rgba(76, 175, 80, 0.3);
            color: #388e3c;
        }

        .modality-badge.graph {
            background: linear-gradient(135deg, rgba(255, 193, 7, 0.12), rgba(255, 152, 0, 0.08));
            border-color: rgba(255, 152, 0, 0.3);
            color: #f57c00;
        }

        .modality-badge.dataset {
            background: linear-gradient(135deg, rgba(0, 150, 136, 0.12), rgba(0, 121, 107, 0.08));
            border-color: rgba(0, 150, 136, 0.3);
            color: #00796b;
        }

        .project-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: #7f96c2;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .project-card:hover .project-link {
            color: #1c3177;
            gap: 12px;
        }

        .project-link::after {
            content: '→';
            transition: transform 0.3s ease;
        }

        .project-card:hover .project-link::after {
            transform: translateX(4px);
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .projects-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .container {
                padding: 40px 16px;
            }

            header {
                margin-bottom: 50px;
            }

            .modality-badge {
                font-size: 0.7rem;
                padding: 3px 8px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }

            .subtitle {
                font-size: 0.9rem;
            }

            .project-card {
                padding: 20px;
            }

            .project-icon {
                width: 50px;
                height: 50px;
                font-size: 24px;
            }

            .project-title {
                font-size: 1.2rem;
            }

            .project-description {
                font-size: 0.9rem;
            }

            .modality-badge {
                font-size: 0.65rem;
                padding: 3px 7px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>y3162 Audio</h1>
            <p class="subtitle">Portfolio & Projects</p>
        </header>

        <div class="projects-grid">
            <a href="b4thesis/index.html" class="project-card">
                <div class="project-icon">🎓</div>
                <h2 class="project-title">Bachelor's Thesis</h2>
                <p class="project-description">「個人識別性を保った話者の属性編集」のデモページ
                </p>
                <div class="modality-tags">
                    <span class="modality-badge audio">🔊 Audio</span>
                </div>
                <span class="project-link">詳細を見る</span>
            </a>
        </div>
    </div>
</body>
</html>
